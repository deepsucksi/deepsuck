<!doctype html>
<!-- DeepSuck — Open Graph 图模板（1200×630，R11 视觉）。由 scripts/og.js 用无头 Chrome 渲染为 site/assets/og*.png。?v=home|demo|intel -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* R11 视觉：白底、单色标志 + 字标、橙红听筒；字体与配色同 site/assets/css/style.css */
  @font-face{font-family:"Manrope";src:url("../../site/assets/fonts/Manrope.ttf") format("truetype");font-weight:200 800}
  @font-face{font-family:"IBM Plex Mono";src:url("../../site/assets/fonts/IBMPlexMono-Regular.ttf") format("truetype");font-weight:400}
  :root{--bg:#fff;--sunk:#f2f4f5;--line:#e3e7e9;--ink:#171c1f;--muted:#606b72;--accent:#b74224;--night:#111313}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;background:var(--bg);color:var(--ink);font-family:"Manrope","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .page{position:relative;width:1200px;height:630px;padding:64px 80px}
  .art{position:absolute;right:-40px;top:22px;width:580px;height:auto;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 92%);mask-image:linear-gradient(to bottom,#000 72%,transparent 92%)}
  .brand{position:relative;display:flex;align-items:center;gap:4px}
  .brand .mark{width:58px;height:52px;position:relative;overflow:hidden}
  .brand .mark img{position:absolute;width:70px;height:70px;left:-7px;top:-9px;filter:brightness(0)}
  .brand .word{width:158px;height:43px;object-fit:contain;filter:brightness(0)}
  .eyebrow{position:relative;margin-top:58px;font-size:20px;letter-spacing:.08em;color:var(--accent)}
  h1{position:relative;margin-top:18px;max-width:700px;font-size:74px;line-height:1.16;font-weight:800;letter-spacing:-.02em}
  h1 em{display:block;font-style:normal;color:var(--ink)}
  .chat{position:absolute;right:64px;bottom:136px;width:400px;display:flex;flex-direction:column;gap:12px}
  .b{padding:15px 20px;border-radius:10px;font-size:20px;line-height:1.6;box-shadow:0 10px 30px rgba(17,19,19,.12)}
  .r{align-self:flex-end;background:var(--night);color:#f4f5f5}
  .s{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .foot{position:absolute;left:80px;right:80px;bottom:52px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:22px;font-family:"IBM Plex Mono","Noto Sans Mono CJK SC",ui-monospace,Menlo,monospace;font-size:19px;color:var(--muted)}
  .v-intel h1{font-size:64px}
  .foot b{font-weight:400;color:var(--accent)}
</style>
</head>
<body>
<div class="page">
  <img class="art" src="../../site/assets/brand/on-hold-960.webp" alt="">
  <div class="brand"><span class="mark"><img src="../../site/assets/brand/on-hold-mono-256.png" alt=""></span><img class="word" src="../../site/assets/brand/wordmark.svg" alt="DeepSuck"></div>
  <p class="eyebrow" id="eyebrow">开源 · 防御性研究 · 中文场景优先</p>
  <h1 id="title">让骗子把时间<em>浪费在 AI 身上</em></h1>
  <div class="chat" id="chat">
    <div class="b r">转到安全账户，马上！</div>
    <div class="b s">你等一下，我拿笔记。卡号你一个字一个字发我？</div>
  </div>
  <div class="foot"><span id="foot"><b>622202*********3445</b> · 139****2233 · 已拖住 14:32</span><span>deepsuck.si</span></div>
</div>
<script>
  var V = {
    demo: { eyebrow: '沙盒演示 · 你扮演骗子', title: '试试能不能<em>骗到王阿姨</em>',
      foot: '<b>7 个场景</b> · 3 个人设 · 浏览器本地运行 · 无需 API Key' },
    intel: { eyebrow: '公开诈骗情报库', title: '诈骗电话、钱包、网址<em>公开可查</em>',
      foot: '<b>JSON / CSV</b> · 银行卡与姓名部分打码 · 可申诉下架', chat: false }
  }[new URLSearchParams(location.search).get('v')];
  if (V) {
    document.getElementById('eyebrow').textContent = V.eyebrow;
    document.getElementById('title').innerHTML = V.title;
    document.getElementById('foot').innerHTML = V.foot;
    if (V.chat === false) document.getElementById('chat').remove();
    document.body.className = 'v-' + new URLSearchParams(location.search).get('v');
  }
</script>
</body>
</html>
