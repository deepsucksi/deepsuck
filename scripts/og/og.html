<!doctype html>
<!-- DeepSuck — Open Graph 图模板（1200×630）。由 scripts/og.js 用无头 Chrome 渲染为 site/assets/og*.png。?v=home|demo|intel -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#f7f6f3;--surface:#fff;--sunk:#f0eee9;--line:#e5e2dc;--ink:#161514;--muted:#5c5953;--dim:#6c6963;--accent:#8a5a2b}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  .page{position:relative;width:1200px;height:630px;padding:72px 88px}
  .brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .brand img{width:40px;height:40px}
  .eyebrow{margin-top:56px;font-size:20px;letter-spacing:.08em;color:var(--accent)}
  h1{margin-top:18px;font-size:76px;line-height:1.16;font-weight:600;letter-spacing:-.02em}
  h1 em{display:block;font-style:normal;font-weight:400;color:var(--muted)}
  .chat{position:absolute;right:88px;top:184px;width:380px;display:flex;flex-direction:column;gap:14px}
  .b{padding:16px 20px;border-radius:18px;font-size:21px;line-height:1.6}
  .r{align-self:flex-end;background:var(--ink);color:#f3f2ef;border-bottom-right-radius:5px}
  .s{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:5px}
  .foot{position:absolute;left:88px;right:88px;bottom:60px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:22px;font-family:"Noto Sans Mono CJK SC",ui-monospace,Menlo,monospace;font-size:19px;color:var(--dim)}
  .foot b{font-weight:400;color:var(--accent)}
</style>
</head>
<body>
<div class="page">
  <div class="brand"><img src="../../site/assets/logo.svg" alt="">DeepSuck</div>
  <p class="eyebrow" id="eyebrow">开源 · 防御性研究 · 中文场景优先</p>
  <h1 id="title">让骗子把时间<em>浪费在 AI 身上</em></h1>
  <div class="chat" id="chat">
    <div class="b r">转到安全账户，马上！</div>
    <div class="b s">等我找下老花镜……卡号你一个字一个字发我呀？</div>
  </div>
  <div class="foot"><span id="foot"><b>6222 **** **** 3445</b> · 139****2233 · 已拖住 14:32</span><span>deepsuck.si</span></div>
</div>
<script>
  var V = {
    demo: { eyebrow: '沙盒演示 · 你扮演骗子', title: '试试能不能<em>骗到王阿姨</em>',
      foot: '<b>7 个场景</b> · 3 个人设 · 浏览器本地运行 · 无需 API Key' },
    intel: { eyebrow: '公开诈骗情报库', title: '诈骗电话、钱包、网址<em>公开可查</em>',
      foot: '<b>JSON / CSV</b> · 银行卡与姓名部分打码 · 可申诉下架', chat: false }
  }[new URLSearchParams(location.search).get('v')];
  if (V) {
    document.getElementById('eyebrow').textContent = V.eyebrow;
    document.getElementById('title').innerHTML = V.title;
    document.getElementById('foot').innerHTML = V.foot;
    if (V.chat === false) document.getElementById('chat').remove();
  }
</script>
</body>
</html>
