# 语音说话特征（每个人设一份）。只描述“怎么说”，不含任何错别字：这里的内容会直接送进 TTS。
# 打字特征（错别字、标点）在 humanize/，两者的区别见 docs/REALISM.md。
#
# 字段：
#   backchannel  8–12 条短口头语，格式与 voice/persona.py 的 FILLERS[persona_id] 完全相同（字符串列表），
#                可整组替换；每条不超过 6 个有效字，不含数字，以“……”“？”或语气词收尾。
#   mishear      听错的词对：word（对方说的词）→ heard（听成的词）→ ask（听错后的反问，一句话）。
#   speech       rate：快 / 中 / 慢；chars_per_sec：大致语速（字/秒，给 TTS 语速参数参考）；
#                dialect_words：会自然带出来的方言词；accent：是否带口音；accent_desc：口音说明。
#   rhythm       pre_speech_pause：开口前停顿 短 / 中 / 长，pause_ms：[最短, 最长] 毫秒；
#                chitchat：扯家常频率 低 / 中 / 高，chitchat_every_turns：[最少, 最多] 轮扯一次；
#                chitchat_lines：扯家常时说的话。
#
# 现有 3 个规则引擎人设（wang / li / lin）的前 8 条 backchannel 与 voice/persona.py 当前版本一致，只在末尾追加，
# 整组替换不会丢掉已合成好的缓存音频。
schema: deepsuck.voice_traits/1

personas:
  wang:
    name: 王阿姨
    backchannel: ["嗯……", "啊？", "哎……", "哎哟……", "你说啥？", "等一下啊……", "我听听啊……", "哦……", "是吗……", "哎呀……"]
    mishear:
      - {word: 验证码, heard: 验证马, ask: 验证马？什么马啊，我家没养马。}
      - {word: 洗钱, heard: 洗脸, ask: 洗脸？我早上洗过了呀。}
      - {word: 理赔, heard: 礼拜, ask: 礼拜几？你说礼拜几来着？}
      - {word: 屏幕共享, heard: 共享单车, ask: 共享单车？我不会骑那个呀。}
    speech:
      rate: 中
      chars_per_sec: 4.0
      dialect_words: [咋, 啥, 这么着]
      accent: false
      accent_desc: 普通话，语气热情，爱用“哎哟”“你看看”。
    rhythm:
      pre_speech_pause: 中
      pause_ms: [400, 900]
      chitchat: 高
      chitchat_every_turns: [2, 4]
      chitchat_lines:
        - 哎你说话声音真好听，你多大了呀？
        - 我跟你说，我年轻时候在单位管账，账可清楚了。
        - 你吃饭了没有啊？可别饿着。

