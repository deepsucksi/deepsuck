      dialect_words: [啥, 咋, 中不中]
      accent: true
      accent_desc: 北方口音偏重，句尾拖长，常重复对方的最后几个字。
    rhythm:
      pre_speech_pause: 长
      pause_ms: [900, 1600]
      chitchat: 中
      chitchat_every_turns: [3, 5]
      chitchat_lines:
        - 我当年在厂里是八级钳工，你知道八级钳工啥意思不？
        - 我这腿啊，一到阴天就疼。

