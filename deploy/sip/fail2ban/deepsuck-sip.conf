# fail2ban 防暴力注册/扫号（bootstrap.sh 在 WITH_SIP=1 时装到 /etc/fail2ban/jail.d/）。
# 用 fail2ban 自带的 asterisk 过滤器读 Asterisk security 日志（InvalidPassword、InvalidAccountID、
# ChallengeResponseFailed 等）；容器内日志是 UTC，所以 logtimezone = UTC。
# 10 分钟内失败 5 次封该 IP 1 小时，重犯时间翻倍；封的是该 IP 的全部端口。
[deepsuck-sip]
enabled = true
filter = asterisk
logpath = /var/log/deepsuck-sip/security
backend = polling
logtimezone = UTC
maxretry = 5
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
banaction = %(banaction_allports)s
ignoreip = 127.0.0.1/8 ::1
