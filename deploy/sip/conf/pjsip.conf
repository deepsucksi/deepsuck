; DeepSuck 自建 SIP 软电话：只有一个分机账号，只能呼入一个 AI 分机；没有任何外线/中继/外呼。
[global]
type = global
user_agent = DeepSuck
default_realm = deepsuck
endpoint_identifier_order = username
; 短时间内大量未识别请求（扫号）记 security 日志，供 fail2ban 封禁
unidentified_request_count = 3
unidentified_request_period = 5
unidentified_request_prune_interval = 30
max_forwards = 10
keep_alive_interval = 30
; 不带 401 质询就直接拒绝未识别的 INVITE 会暴露账号是否存在，所以保持默认（一律质询）

[system]
type = system
disable_tcp_switch = yes

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:${SIP_PORT}
allow_reload = no
${NAT}

${TCP}

${ACL}

[${SIP_USER}]
type = endpoint
context = deepsuck-in
disallow = all
allow = ${SIP_CODECS}
auth = ${SIP_USER}-auth
aors = ${SIP_USER}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
allow_subscribe = no
allow_transfer = no
allow_overlap = no
send_pai = no
trust_id_inbound = no
trust_id_outbound = no
media_encryption = no
max_audio_streams = 1
max_video_streams = 0
rtp_timeout = 30
rtp_timeout_hold = 60
timers = yes
one_touch_recording = no
device_state_busy_at = ${SIP_MAX_CALLS}

[${SIP_USER}-auth]
type = auth
auth_type = digest
username = ${SIP_USER}
password = ${SIP_PASSWORD}
realm = deepsuck

[${SIP_USER}]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
minimum_expiration = 60
default_expiration = 300
maximum_expiration = 3600
