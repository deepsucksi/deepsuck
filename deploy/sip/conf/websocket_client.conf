; Asterisk 作为 WebSocket 客户端，只连本机/容器内网的 voice 服务（docs/PHONE.md 第 10 节）。
; token 走 HTTP Basic 的密码（Authorization 请求头），不放进 URL，避免出现在访问日志里。
[deepsuck]
type = websocket_client
uri = ${SIP_VOICE_URL}/telephony/asterisk-ws
username = asterisk
password = ${SIP_TOKEN}
connection_type = per_call_config
connection_timeout = 3000
reconnect_interval = 500
reconnect_attempts = 2
tls_enabled = no
