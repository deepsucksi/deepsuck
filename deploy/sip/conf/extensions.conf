; 拨号计划：只有 ${SIP_AI_EXTEN} 一个分机，接到 voice 服务的 AI；其他号码不存在（PJSIP 直接回 404）。
; 没有任何 Dial(PJSIP/...) 外呼、没有中继、没有 [default] 上下文。
[general]
static = yes
writeprotect = yes
autofallthrough = yes
clearglobalvars = yes

[deepsuck-in]
exten => ${SIP_AI_EXTEN},1,NoOp(DeepSuck AI)
 same => n,Set(GROUP()=deepsuck-ai)
 same => n,GotoIf($[${GROUP_COUNT(deepsuck-ai)} > ${SIP_MAX_CALLS}]?busy)
 same => n,Set(TIMEOUT(absolute)=${SIP_MAX_SECONDS})
 same => n,Set(__DS_FROM=${CALLERID(num)})
 same => n,Set(__DS_EXTEN=${EXTEN})
 same => n,Dial(WebSocket/deepsuck/c(${SIP_MEDIA_FORMAT})f(json),15)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; voice 服务没开/连不上：回 503，而不是让手机一直响
 same => n,Hangup(34)
 same => n(done),Hangup()
 same => n(busy),Busy(5)
 same => n,Hangup(17)

exten => i,1,Hangup(1)
exten => t,1,Hangup()
