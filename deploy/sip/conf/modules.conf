; 白名单加载：只开 PJSIP 注册/呼入、RTP、G.722/G.711 编解码、拨号计划和 chan_websocket。
; 不加载：AMI（manager）、ARI、HTTP 应用、外线注册（res_pjsip_outbound_registration）、
; 匿名/按 IP 识别端点（res_pjsip_endpoint_identifier_anonymous / _ip）、IAX2、语音信箱、CDR/CEL 等。
