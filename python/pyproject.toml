[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsuck"
version = "0.4.0"
description = "DeepSuck Python core：中文诈骗情报提取、去武装规范化、话术分类、脱敏与规则人设引擎（与浏览器端共用规则）。"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
stix = ["stix2>=3"]

[project.scripts]
deepsuck-blocklist = "deepsuck.blocklist:main"
deepsuck-sim = "deepsuck.sim:main"
deepsuck-stix = "deepsuck.stix:main"
deepsuck-cardbin = "deepsuck.cardbin:main"

[tool.setuptools]
packages = ["deepsuck"]

[tool.setuptools.package-data]
deepsuck = ["_core/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
