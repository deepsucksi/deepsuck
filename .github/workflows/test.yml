name: test
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install pytest stix2
      - name: core parity tests (shared tests/fixtures)
        run: cd python && python -m pytest -q
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r voice/requirements.txt
      - name: voice unit tests (mocked DashScope websocket, no key needed)
        run: python -m pytest voice/tests -q
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap.sh syntax + shellcheck
        run: bash -n deploy/bootstrap.sh && shellcheck -S error deploy/bootstrap.sh
      - name: compose config + Caddyfile validate
        run: |
          cp deploy/.env.example deploy/.env
          # LIVE_DOMAIN / ACME_EMAIL have no defaults: config must fail while they are empty
          if docker compose -f deploy/docker-compose.yml config -q 2>/dev/null; then echo "compose accepted empty LIVE_DOMAIN/ACME_EMAIL"; exit 1; fi
          sed -i 's/^LIVE_DOMAIN=$/LIVE_DOMAIN=live.example.com/; s/^ACME_EMAIL=$/ACME_EMAIL=ops@example.com/' deploy/.env
          docker compose -f deploy/docker-compose.yml --profile turn config -q
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e LIVE_DOMAIN=live.example.com -e ACME_EMAIL=ops@example.com caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: build images
        run: docker compose -f deploy/docker-compose.yml build
      - name: smoke (no key → rule-only health)
        run: |
          docker run -d --name ds-proxy --network host -e ALLOWED_ORIGINS=https://deepsuck.si deepsuck-proxy
          docker run -d --name ds-voice --network host -e VOICE_DAILY_BUDGET_CNY=1 deepsuck-voice
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && curl -fsS http://127.0.0.1:7860/api/voice/health && exit 0; sleep 2; done
          docker logs ds-proxy; docker logs ds-voice; exit 1
