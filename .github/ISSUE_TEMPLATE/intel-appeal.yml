name: 下架申诉 / Takedown & appeal
description: 认为情报库错误收录了你的号码、账户或网站？只需提供条目 ID，无需公开你的个人信息。
title: "[下架申诉] "
labels: ["intel-appeal"]
body:
  - type: markdown
    attributes:
      value: |
        **DeepSuck 为非官方项目，与 DeepSeek 无关。** 我们会优先处理申诉：先将条目标记为 `disputed`（页面隐藏具体值），核实后下架或恢复。
        **请不要在这里填写你的手机号、银行卡号、姓名等个人信息**——条目 ID 就足够了。
  - type: input
    id: entry_id
    attributes:
      label: 条目 ID
      description: 在情报卡片底部，例如 EX-0001 或 DS-2026-0001
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: 申诉原因
      options:
        - 号码/账号已被回收、重新分配给我
        - 我的银行卡/账户被他人冒用或盗用
        - 域名已易主 / 网站已不是诈骗站点
        - 信息有误（类型、场景或打码问题）
        - 其他
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 说明（可选）
      description: 如涉及隐私不便公开，可只写“需要私下沟通”，维护者会提供非公开的联系方式。
