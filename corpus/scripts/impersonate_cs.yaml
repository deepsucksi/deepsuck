id: impersonate_cs
name: 冒充客服
aliases: [冒充电商客服, 冒充物流客服, 退款理赔, 取消会员自动扣费]
version: 1
related:
  scenario: refund
  tactics: [cs_impersonation, account_risk, app_download, screen_share, otp, transfer, urgency]
targets: 近期有网购、快递、直播打赏或开通过会员服务的人；对平台规则不熟悉的中老年人。
summary: 冒充电商、物流或平台客服，以退款理赔、取消扣费为由，引导下载会议/远程软件、共享屏幕、报验证码，最终转账或贷款转出。
stages:
  - id: hook
    name: 开场建立身份
    goal: 报出订单或快递信息，让对方相信是官方客服。
    lines:
      - 您好，我是{机构}的售后客服，您前几天买的商品检测出质量问题，我们这边给您办理退款。
      - 您的快递在运输途中丢件了，平台按规定给您三倍理赔。
      - 系统显示您开通了某平台的会员服务，下个月开始每月自动扣费，请问是您本人开通的吗？
  - id: problem
    name: 制造问题
    goal: 让对方觉得不处理会有损失。
    lines:
      - 退款需要您本人在系统里确认，不然钱会原路退不回去。
      - 这个扣费不取消的话，会每个月从您绑定的银行卡里扣。
  - id: tool
    name: 引导下载与共享屏幕
    goal: 把对方从正规渠道引到骗子可控的软件里。
    lines:
      - 您下载一个{APP名}，输入我给您的会议号，我远程指导您操作。
      - 您点一下屏幕共享，我帮您看看是哪一步出错了。
  - id: harvest
    name: 套取验证码与账户
    goal: 拿到验证码、银行卡信息或支付密码。
    lines:
      - 系统给您发了一个验证码，这是退款凭证，您念给我核对一下。
      - 您把收款的银行卡号报一下，我这边给您登记。
  - id: cashout
    name: 转账或贷款转出
    goal: 让对方主动转账，或在借贷平台借款后转出。
    lines:
      - 您的账户信用分不够，需要先在借款平台申请一笔额度，验证完马上自动还款。
      - 请把钱转到我们的理赔专用账户 {银行卡}，户名 {户名}，验证通过会连同理赔款一起退给您。
keywords: [客服, 售后, 退款, 理赔, 双倍赔偿, 质量问题, 快递丢件, 会员, 自动扣费, 关闭服务, 会议号, 屏幕共享, 远程协助, 验证码, 备用金, 信用分, 理赔专用账户]
pressure_tactics:
  - id: loss_threat
    name: 损失威胁
    desc: 声称不处理会持续扣费或影响征信。
    lines:
      - 今天不关掉的话，每个月都要扣几百块，而且会影响您的征信记录。
  - id: deadline
    name: 时限压迫
    desc: 给出很短的处理时限。
    lines:
      - 理赔通道半小时后就关闭了，您得抓紧。
  - id: authority_procedure
    name: 伪造正规流程
    desc: 用工号、流程编号、“系统规定”增加可信度。
    lines:
      - 我的工号是{工号}，这是平台统一的理赔流程，您放心操作。
  - id: isolation
    name: 阻止核实
    desc: 不让对方挂断或向平台官方核实。
    lines:
      - 您不要挂电话，挂了系统会重新排队，退款就作废了。
intel_exposed: [app, url, bank, phone, name]
red_flags:
  - 正规平台退款只走原路退回，不需要下载会议软件或共享屏幕。
  - 任何要求念验证码、开通借款额度“验证”的客服都是骗子。
  - 挂断后自己打开官方 APP 或拨打官方客服核实。
examples:
  - id: cs-01
    turns:
      - {role: scammer, text: "您好，我是快递公司理赔专员，您的包裹在运输途中丢失，我们给您赔偿。"}
      - {role: victim, text: "啊？我没收到通知啊。"}
      - {role: scammer, text: "我们这边直接给您线上理赔，您先下载一个{APP名}，我远程教您。"}
      - {role: victim, text: "不能直接退到我账户里吗？"}
      - {role: scammer, text: "系统需要您本人认证，下载后输入会议号，打开屏幕共享就行。"}
  - id: cs-02
    turns:
      - {role: scammer, text: "系统显示您开通了直播平台的会员，每月自动扣费，需要帮您关闭吗？"}
      - {role: victim, text: "我没开过啊，要怎么关？"}
      - {role: scammer, text: "关闭要先验证您的还款能力，您在借款平台看一下有没有额度。"}
      - {role: victim, text: "关会员为什么要看借款额度？"}
      - {role: scammer, text: "这是银联的规定，借出来的钱转到监管账户 {银行卡}，验证完马上退回。"}
  - id: cs-03
    turns:
      - {role: scammer, text: "您购买的儿童玩具检测出有害物质，平台给您办理退款加补偿。"}
      - {role: scammer, text: "刚才系统给您发了验证码，这是退款凭证，麻烦您念一下。"}
      - {role: victim, text: "短信上写着不要告诉任何人啊。"}
      - {role: scammer, text: "那是对外人说的，我是官方客服，您不说退款就办不了。"}
source: 维护者根据公开反诈宣传归纳改写，不含真实案例原文。
